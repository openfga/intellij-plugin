name: Pull Request build and test

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - main

env:
  PLUGIN_ARTIFACT_NAME: 'openfga_intellij_plugin'
  DIST_FOLDER: 'build/distributions'

jobs:
  build:
    name: Build OpenFGA plugin for IntelliJ Platform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Java version from gradle.properties
        run: |
          JAVA_VERSION=$(grep '^javaVersion=' gradle.properties | cut -d'=' -f2)
          if ! [[ "$JAVA_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Java version: $JAVA_VERSION"
            exit 1
          fi
          echo "JAVA_VERSION=$JAVA_VERSION" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Build the plugin using Gradle
        run: ./gradlew check buildPlugin

      - name: Verify change-notes are generated from CHANGELOG.md
        run: make check-change-notes

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: '${{ env.PLUGIN_ARTIFACT_NAME }}'
          path: '${{ env.DIST_FOLDER }}/'


  verifier_matrix:
    name: Read plugin verifier IDE list
    runs-on: ubuntu-latest
    outputs:
      ides: ${{ steps.ides.outputs.ides }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pluginVerifier.ides from gradle.properties
        id: ides
        run: |
          IDES=$(grep '^pluginVerifier.ides=' gradle.properties | cut -d'=' -f2- \
            | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | jq -R . | jq -sc .)
          if [ "$IDES" = "[]" ] || [ -z "$IDES" ]; then
            echo "::error::pluginVerifier.ides is missing or empty in gradle.properties"
            exit 1
          fi
          echo "ides=$IDES" >> "$GITHUB_OUTPUT"

  test_compatibility:
    name: Test plugin compatibility with IntelliJ Platform ${{ matrix.ide }}
    needs:
      - build
      - verifier_matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2  # Limit parallelization to avoid overwhelming runners
      matrix:
        ide: ${{ fromJSON(needs.verifier_matrix.outputs.ides) }}
    steps:
      # Runs before Java setup: it clears the runner tool cache, which is where setup-java installs the JDK.
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$RUNNER_TOOL_CACHE"
          echo "Disk space after cleanup:"
          df -h

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Java version from gradle.properties
        run: |
          JAVA_VERSION=$(grep '^javaVersion=' gradle.properties | cut -d'=' -f2)
          if ! [[ "$JAVA_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Java version: $JAVA_VERSION"
            exit 1
          fi
          echo "JAVA_VERSION=$JAVA_VERSION" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Verify plugin on IntelliJ Platform ${{ matrix.ide }}
        run: ./gradlew verifyPlugin -PpluginVerifier.ides=${{ matrix.ide }}

      - name: Upload plugin verifier report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-verifier-report-${{ matrix.ide }}
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# JVM target version for compilation
# Make sure it is compatible with the minimum supported version of IntelliJ Platform (17 for 2024.1+)
# Source: https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html#platformVersions
javaVersion=17

# Plugin compatibility
plugin.sinceBuild=233
plugin.untilBuild=263.*

# IDEs checked by `./gradlew verifyPlugin` (comma-separated "<type code>-<version>").
# The CI compatibility matrix is generated from this list, one IDE per job.
pluginVerifier.ides=IC-2023.3,IC-2024.3,IU-2023.3,IU-2024.3,IU-2025.3,IU-2026.1,IU-2026.2,IU-2026.3
